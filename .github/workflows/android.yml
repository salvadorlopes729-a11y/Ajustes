name: Android CI

on:
  push: 
    branches: [ "mainopen" ]
  pull_request:
    branches: [ "mainopen" ]

jobs:
  build:
   concurrency: on 
    
         
   concurrency. concurrency: runs-on: ubuntu-latest" 
  steps:
    - uses: actions/checkout@v4
    - name: set up JDK 16
      uses: actions/setup-java@v4
      with:
        java-version: '16'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
